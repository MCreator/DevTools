plugins {
    id 'java'
    id 'idea'
}

group 'org.example'
version '1.1-SNAPSHOT'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url "https://repo.gradle.org/gradle/libs-releases" } // for gradle-tooling-api
    flatDir { dirs mcreator_path + '/lib' }
}

// MCreator's build script configures idea.project, which only exists on the root project. As MCreator is included
// here as a subproject, share this root project's IDEA project model with it so its configuration does not fail
project(':MCreator').plugins.withType(IdeaPlugin).configureEach { ideaPlugin ->
    ideaPlugin.model.project = rootProject.idea.project
}

dependencies {
    implementation project(':MCreator')

    project(':MCreator').afterEvaluate(() ->
            project(":MCreator").configurations.named("implementation").get().dependencies.each {
                //noinspection ForeignDelegate
                implementation it
            }
    )
}
